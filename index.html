<meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RanisPetari - Where Tradition Meets Fashion</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
html, body { overflow-x:hidden; max-width:100%; width:100%; }
body { background:#fffaf5; }
.topbar{background:linear-gradient(90deg,#9a1f3d,#4a102c);color:#fff;text-align:center;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;}
@keyframes leftRight{0%{transform:translateX(0)}50%{transform:translateX(12px)}100%{transform:translateX(0)}}
.logo-move{animation:leftRight 2s infinite ease-in-out; height:50px; background:white; border-radius:50%; padding:4px;}
nav{background:#1c1c2e;display:flex;justify-content:center;gap:18px;padding:12px;position:sticky;top:0;z-index:1000;flex-wrap:wrap;}
nav a,.dropbtn{color:#fff;text-decoration:none;font-size:14px;cursor:pointer;background:none;border:none;padding:5px 8px;}
.dropdown{position:relative;display:inline-block}
.dropdown-content{display:none;position:absolute;background:#fff;min-width:200px;box-shadow:0 8px 16px rgba(0,0,0,0.2);z-index:9999;border-radius:8px;top:28px;left:0;max-height:400px;overflow:auto;}
.dropdown-content a{color:#333!important;padding:10px 14px;display:block;text-decoration:none;font-size:14px}
.dropdown-content a:hover{background:#f5e6e8}
.dropdown:hover.dropdown-content{display:block}
.products,.collection-grid{display:grid;gap:12px;padding:15px;max-width:1300px;margin:auto}
.products{grid-template-columns:repeat(2,1fr);}
.collection-grid{grid-template-columns:repeat(2,1fr);}
@media (min-width:769px){.products,.collection-grid{grid-template-columns:repeat(4,1fr);gap:20px;padding:20px;} }
.card{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 3px 12px rgba(0,0,0,0.1);text-align:center;padding-bottom:12px;cursor:pointer;transition:0.2s;}
.card:hover{transform:translateY(-3px);}
.card img,.card video{width:100%;aspect-ratio:3/4;object-fit:contain;background:#fff;display:block;}
.card video{object-fit:cover;}
.price{color:#4a102c;font-weight:bold;font-size:17px;margin:6px 0;display:block;}
.buy{background:#0d4a8a;color:white!important;padding:8px 22px;border-radius:25px;display:inline-block;border:none;cursor:pointer;margin-top:6px;}
.buy-now{background:#0d4a8a;color:#fff;padding:8px 22px;border-radius:25px;display:inline-block;cursor:pointer;margin-top:6px;font-size:14px;}
.scroll-text{display:inline-block; white-space:nowrap; animation:scrollLeft 18s linear infinite;}
@keyframes scrollLeft{0%{transform:translateX(100%)}100%{transform:translateX(-100%)}}
/* SIZE GUIDE BOX */
#sizeInfoBox{display:none; position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#4a102c; color:#fff; padding:12px 15px; border-radius:10px; z-index:100001; font-size:12px; width:92%; max-width:360px; text-align:center; line-height:1.4;}
</style>
</head>
<section id="watch-and-buy-rani" style="padding: 30px 0; background: #fff8f5;">
<h2 style="text-align:center; font-family: serif; font-size:30px; margin-bottom:20px; color:#4a2a2a;">Watch and Buy</h2>
<div class="watch-buy-wrapper">
<!-- Video me preload lagaya hai hang rokne ke liye -->
<div class="watch-card" data-name="Rani Petari Collection - Design 1" data-price="999" data-mrp="1999" data-video="V1.mp4">
<div class="video-box"><video src="V1.mp4" preload="metadata" muted loop playsinline class="reel-video"></video><button class="sound-toggle">🔇</button><div class="tag">50% OFF</div></div>
<div class="p-details"><b>Rani Petari Collection</b><br><span style="text-decoration:line-through; color:gray; font-size:12px;">MRP ₹1999</span> <span style="color:#b91c1c; font-weight:bold;">₹999</span></div>
<div class="size-selector"><span class="size-btn">M</span><span class="size-btn">L</span><span class="size-btn">XL</span><span class="size-btn">XXL</span></div>
<button class="buy-now-btn" onclick="openBuyModal(this)">BUY NOW</button>
</div>
<!-- Baaki 5 cards bhi same preload="metadata" kar do -->
</div>
</section>

<!-- Size Info Popup -->
<div id="sizeInfoBox"></div>
<script>
let selSizeVal = "";
let curProd = {name:"", price:0, img:""};

// Measurement Data
const sizeChart = {
 'S': 'TOP: Bust 34-36" Shoulder 14-15" | BOTTOM: Waist 28-30" Hip 36-38"',
 'M': 'TOP: Bust 36-38" Shoulder 15-16" | BOTTOM: Waist 30-32" Hip 38-40"',
 'L': 'TOP: Bust 38-40" Shoulder 16-17" | BOTTOM: Waist 32-34" Hip 40-42"',
 'XL': 'TOP: Bust 40-42" Shoulder 17-18" | BOTTOM: Waist 34-36" Hip 42-44"',
 'XXL': 'TOP: Bust 42-44" Shoulder 18-19" | BOTTOM: Waist 36-38" Hip 44-46"'
};

function selSize(btn, size){
 document.querySelectorAll('.sBtn').forEach(b=>{b.style.border='1px solid #d4d5d9'; b.style.color='#000';});
 btn.style.border='1px solid #ff3f6c'; btn.style.color='#ff3f6c';
 selSizeVal = size;
 document.getElementById('sizeErr').style.display='none';
 // Measurement dikhao
 let box = document.getElementById('sizeInfoBox');
 box.innerHTML = '<b>Size '+size+'</b><br>'+sizeChart[size];
 box.style.display='block';
 setTimeout(()=>{ box.style.display='none'; }, 4000);
}

function checkPin(){ let pin = document.getElementById('pinCheck').value; let msg = document.getElementById('pinMsg'); if(pin.length!=6){ msg.innerText="Enter valid 6 digit pincode"; msg.style.color="#ff3f6c"; return; } msg.innerText="✓ Delivery available in 4-5 days at "+pin; msg.style.color="#03a685"; document.getElementById('cPin').value = pin; }
function closeM(){ document.getElementById('pModal').style.display='none'; }

// JEWELLERY = Direct Razorpay, SUIT = Size pucho
function payNow(pName, pPrice){
 let card = event.target.closest('.card');
 let isJewellery = card && card.dataset.collection === 'JEWELLERY';
 curProd = {name:pName, price:pPrice, img: card? (card.querySelector('img')?.src || '') : ''};
 if(isJewellery){
   selSizeVal = 'FREE SIZE - JEWELLERY';
   document.getElementById('coTitle').innerText = pName;
   document.getElementById('coSize').innerText = 'FREE SIZE';
   document.getElementById('coPrice').innerText = '₹'+pPrice;
   document.getElementById('checkoutModal').style.display='block';
 } else {
   openP(card);
 }
}

function openP(el){
 selSizeVal=""; let img = el.querySelector('img')? el.querySelector('img').src : "";
 let title = el.innerText.split('₹')[0].replace('BUY NOW','').trim().slice(0,80);
 let price = parseInt(el.getAttribute('data-price')||1499);
 curProd = {name:title, price:price, img:img};
 document.getElementById('pmImg').src=img;
 document.getElementById('pmTitle').innerText=title;
 document.getElementById('pmPrice').innerText="₹"+price;
 document.getElementById('coTitle').innerText=title;
 document.getElementById('coPrice').innerText="₹"+price;
 document.getElementById('pModal').style.display='flex';
}
function openBuyModal(btn){
 let card = btn.closest('.watch-card');
 let price = parseInt(card.dataset.price);
 let name = card.dataset.name;
 payNow(name, price);
}
function addToBag(){
 if(!selSizeVal || selSizeVal.includes('JEWELLERY')){
   // Jewellery ke liye size check skip
   if(document.getElementById('coSize').innerText.includes('FREE')){
     document.getElementById('pModal').style.display='none';
     document.getElementById('checkoutModal').style.display='block';
     return;
   }
 }
 if(!selSizeVal){ document.getElementById('sizeErr').style.display='block'; return; }
 document.getElementById('coSize').innerText=selSizeVal;
 document.getElementById('pModal').style.display='none';
 document.getElementById('checkoutModal').style.display='block';
}

function finalPay(){
 let n=document.getElementById('cName').value, m=document.getElementById('cMob').value, p=document.getElementById('cPin').value, a=document.getElementById('cAddr').value, city=document.getElementById('cCity').value;
 if(!n||!m||!p||!a||!city){ alert("Please fill all fields"); return; }
 if(m.length!=10){ alert("Enter 10 digit mobile"); return; }
 var opt={
   key:"rzp_live_Tj0FPF1woHNLkQ",
   amount:curProd.price*100, currency:"INR", name:"Rani's Petari",
   description:curProd.name+" Size "+selSizeVal,
   image:"https://ranispetari.github.io/logo.png",
   handler:function(r){
     alert("Payment Success! ID: "+r.razorpay_payment_id);
     var msg="NEW ORDER%0AProduct: "+curProd.name+"%0ASize: "+selSizeVal+"%0APrice: Rs"+curProd.price+"%0APayID: "+r.razorpay_payment_id+"%0AName: "+n+"%0AMobile: "+m+"%0APin: "+p+"%0ACity: "+city+"%0AAddr: "+a;
     window.open("https://wa.me/919711900520?text="+msg,"_blank");
     document.getElementById('checkoutModal').style.display='none';
   },
   prefill:{name:n, contact:m},
   theme:{color:"#ff3e6c"},
   modal:{ ondismiss: function(){
     var msg="CANCELLED ORDER%0AProduct: "+curProd.name+"%0ASize: "+selSizeVal+"%0APrice: Rs"+curProd.price+"%0AName: "+n+"%0AMob: "+m;
     window.location.href="https://wa.me/917982213267?text="+msg;
   }}
 };
 var rzp = new Razorpay(opt);
 rzp.on('payment.failed', function (response){ alert("Payment Failed: "+response.error.description); });
 rzp.open();
}

// HANG FIX - Video sirf dikhne pe chalegi
document.addEventListener('DOMContentLoaded', function(){
 let videos = document.querySelectorAll('.reel-video');
 let observer = new IntersectionObserver((entries)=>{
   entries.forEach(entry=>{
     if(entry.isIntersecting){ entry.target.play().catch(()=>{}); }
     else { entry.target.pause(); }
   });
 }, {threshold:0.5});
 videos.forEach(v=>{ observer.observe(v); v.pause(); });
});
</script>
